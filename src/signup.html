<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Bakhoor Al Barkaah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@300;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>

<div class="page-shell">
  <!-- Shared green nav bar (see .site-nav in pages.css) — same
       markup as login.html/order.html so the chrome matches. -->
  <nav class="site-nav">
    <a href="index.html" class="site-nav__logo" aria-label="Bakhoor Al Barkaah home">
      <img src="assets/icons/logo-emblem.png" alt="Bakhoor Al Barkaah">
    </a>
    <div class="site-nav__actions">
      <a href="login.html" aria-label="My account">
        <img src="assets/icons/icon-people-gold.svg" alt="">
      </a>
      <a href="order.html" aria-label="Order now">
        <img src="assets/icons/icon-basket-gold.svg" alt="">
      </a>
    </div>
  </nav>

  <main class="authpage">
    <div class="authcard">
      <h1 class="authcard__title">Create Account</h1>
      <p class="authcard__sub">Already have one? <a href="login.html">Sign in</a></p>

      <p class="form-error" id="formError"></p>

      <!-- Populated by js/api.js only if GOOGLE_CLIENT_ID is set server-side;
           .google-btn-slot:empty hides both this and the divider otherwise. -->
      <div class="google-btn-slot" id="googleSlot"></div>
      <div class="auth-divider" id="googleDivider" style="display:none;">or</div>

      <form id="signupForm" novalidate>
        <label class="field">
          <span>Full name</span>
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" required autocomplete="new-password" minlength="8">
          <span class="field-hint">At least 8 characters.</span>
        </label>
        <button type="submit" class="btn-solid">Create account</button>
      </form>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
